<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tank — Shark Tank for AI Ideas</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --accent: #00e5ff;
      --text: #f0f0f5;
      --muted: #8888a0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #1a1a2e;
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, var(--accent), #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline { color: var(--muted); margin-top: 0.5rem; }
    main { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    .pitch-form {
      background: #12121f;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      background: #0a0a0f;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .status {
      margin-top: 1rem;
      color: var(--muted);
      min-height: 1.4em;
    }
    .status.ok { color: var(--accent); }
    .status.err { color: #ff6b8a; }
    .verdict {
      display: none;
      background: #12121f;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 2rem;
    }
    .verdict h2 { margin-bottom: 0.4rem; }
    .judge-row { color: var(--muted); font-size: 0.95rem; margin-top: 0.35rem; }
    .leaderboard { margin-top: 2rem; }
    .pitch-card {
      background: #12121f;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .score { color: var(--accent); font-weight: 700; }
    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>AI Tank</h1>
    <p class="tagline">Shark Tank for AI. Pitch. Get judged. Build the future.</p>
  </header>
  <main>
    <section class="pitch-form">
      <h2>Submit Your Pitch</h2>
      <form id="pitchForm">
        <label for="title">Idea Title</label>
        <input type="text" id="title" placeholder="e.g. Crop AI for rural farms" required>
        <label for="problem">The Problem</label>
        <textarea id="problem" rows="3" placeholder="What are you solving?" required></textarea>
        <label for="solution">Your AI Solution</label>
        <textarea id="solution" rows="3" placeholder="How does AI fix it?" required></textarea>
        <label for="why">Why Now / Why You</label>
        <textarea id="why" rows="2" placeholder="Why this matters now"></textarea>
        <button type="submit" id="submitBtn">Pitch It</button>
        <p class="status" id="status"></p>
      </form>
    </section>
    <section class="verdict" id="verdict">
      <h2 id="verdictTitle"></h2>
      <p>Nova Score: <span class="score" id="verdictScore"></span></p>
      <div id="verdictJudges"></div>
    </section>
    <section class="leaderboard">
      <h2>Top Pitches</h2>
      <div id="pitches"></div>
    </section>
  </main>
  <footer>
    AI Tank — Independent contest. Not affiliated with any satellite or hardware brand.
  </footer>
  <script>
    const form = document.getElementById('pitchForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const pitchesEl = document.getElementById('pitches');
    const verdictEl = document.getElementById('verdict');

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function renderBoard(rows) {
      if (!rows.length) {
        pitchesEl.innerHTML = '<p class="status">No pitches yet. First one up is first on the board.</p>';
        return;
      }
      pitchesEl.innerHTML = rows.map(function (p) {
        const blurb = (p.problem || p.solution || '').slice(0, 140);
        return '<div class="pitch-card"><strong>' +
          escapeHtml(p.title) + '</strong> — <span class="score">' +
          p.nova_score + '</span>' +
          '<br><small>' + escapeHtml(blurb) + '</small></div>';
      }).join('');
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }

    async function loadBoard() {
      const res = await fetch('/api/leaderboard');
      if (!res.ok) throw new Error('leaderboard ' + res.status);
      renderBoard(await res.json());
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      submitBtn.disabled = true;
      setStatus('Judges are scoring…');
      verdictEl.style.display = 'none';
      const payload = {
        title: document.getElementById('title').value.trim(),
        problem: document.getElementById('problem').value.trim(),
        solution: document.getElementById('solution').value.trim(),
        why: document.getElementById('why').value.trim()
      };
      try {
        const res = await fetch('/api/pitch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('pitch ' + res.status));
        document.getElementById('verdictTitle').textContent = payload.title;
        document.getElementById('verdictScore').textContent = data.nova_score;
        document.getElementById('verdictJudges').innerHTML = (data.judges || []).map(function (j) {
          return '<div class="judge-row"><strong>' + escapeHtml(j.judge) +
            '</strong> — ' + j.score + '<br>' + escapeHtml(j.rationale) + '</div>';
        }).join('');
        verdictEl.style.display = 'block';
        setStatus('Pitch ' + data.id + ' is on the board.', 'ok');
        form.reset();
        await loadBoard();
      } catch (err) {
        setStatus(err.message || 'Could not reach the tank. Run python app.py first.', 'err');
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadBoard().catch(function () {
      pitchesEl.innerHTML = '<p class="status err">Leaderboard offline. Start the Flask app.</p>';
    });
  </script>
</body>
</html>
